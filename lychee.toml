# Config for the dead-link-check workflow (.github/workflows/dead-link-check.yml).
# Several legitimate, working sites in README.md (getrevising.co.uk, leetcode.com,
# mitpress.mit.edu, nailib.com, quizlet.com, smarthistory.org, feynmanlectures.caltech.edu,
# ibdocuments.com, kaptest.com, sparknotes.com, inkscape.org, autodesk.com, ...) reject
# automated / non-browser requests with a 403 even though they're fine in a real browser.
# Accepting 403 avoids constant false-positive noise; a truly dead entry usually surfaces
# as a timeout, DNS failure, TLS error, or 404/410 instead, all of which still fail the check.
# 202 is also accepted: global.oup.com returns it for a valid, working product page.
accept = [200, 202, 206, 403, 429]

max_concurrency = 8
timeout = 20
retry_wait_time = 2
max_retries = 2

user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"

# autodesk.com: manually verified (curl, both HTTP/1.1 and HTTP/2) to return a 403 like the
# other bot-blocked domains above, but lychee's HTTP client fails to negotiate HTTP/2 with
# this specific server and errors before it can even read the status code.
#
# freedomhomeschooling.com: CI got a 401, but manually verified (curl, 3 consecutive
# requests with the configured browser user agent) to return a clean 200 with real content.
# Looks like bot-detection keyed on the GitHub Actions runner IP range rather than an
# actual outage, so excluding rather than accepting 401 globally (a status too easily
# masking a genuinely gated resource elsewhere).
#
# adobe.com, dfat.gov.au, turing-scheme.org.uk: reported in the 2026-08-03 run as
# "HTTP/2 protocol error", "HTTP/2 protocol error" and "SSL certificate error"
# respectively. All three refuse to complete a connection for non-browser clients
# (reproduced with curl over both HTTP/2 and HTTP/1.1, and with a separate fetcher
# on a different network, all hanging until timeout rather than returning a status).
# Three unrelated institutional sites do not go down together; this is bot blocking
# at the edge, so excluding rather than deleting live entries from the list.
#
# chadd.org: reported in the 2026-08-10 run as "SSL certificate expired", but manually
# verified (curl and a separate fetcher, from two different networks) that the TCP
# connection itself never completes, it just hangs until timeout, the same signature
# as the bot-blocking-at-the-edge sites above rather than a server presenting an
# actually-expired certificate (which would complete the handshake and hand back a
# cert). Excluding rather than removing a live, real ADHD-support nonprofit entry.
#
# www.canada.ca and www.dewr.gov.au: reported across the #197/#215/#220 runs as
# "HTTP/2 protocol error". Manually verified (curl, both HTTP/2 and HTTP/1.1, from
# a separate network) that both present current, validly-signed certificates and
# complete the TLS handshake, then reset the stream (HTTP/2) or hang until timeout
# (HTTP/1.1) rather than serving a response. Same bot-blocking-at-the-edge signature
# as the other institutional/government domains above; excluding rather than
# removing two live, official government resources.
#
# ncfe.org.in: reported in the #238 run as "SSL certificate not trusted". Manually
# verified (curl --insecure, openssl s_client) that the server presents a valid
# leaf certificate for *.ncfe.org.in (issued by Sectigo) but doesn't serve the
# intermediate certificate needed to complete the chain, a server-side
# misconfiguration rather than the site being down; curl succeeds with -k and
# returns HTTP 200 with real content. NCFE is the RBI/SEBI/IRDAI/PFRDA-backed
# National Centre for Financial Education, a genuine, live resource. Excluding
# rather than removing it.
#
# swe.org: reported in the #289 run as a timeout. Manually verified (curl,
# three consecutive requests with the configured browser user agent, from a
# separate network) to return a fast, clean 403 every time, the same
# bot-blocking-at-the-edge signature as the other exclusions above rather
# than a real outage; 403 is already globally accepted, but this host
# apparently sometimes hangs instead of returning it. Society of Women
# Engineers is a live, active organization; excluding rather than removing
# the scholarships entry.
# telemanas.mohfw.gov.in and www.nsfas.org.za: reported in the #556 and #561 runs as
# "SSL certificate not trusted". Manually verified (curl, openssl s_client) that both
# serve a leaf certificate without the intermediate needed to complete the chain
# (same server-side misconfiguration as ncfe.org.in above), while curl returns a clean
# HTTP 200 with real content. Tele-MANAS is India's government mental health helpline
# and NSFAS is South Africa's national student funding scheme; both are live.
#
# www.dfat.gov.au/.../australia-awards.aspx: reported in #556 and #561 as "HTTP/2 protocol
# error". Same dfat.gov.au edge behavior as the New Colombo Plan entry above (HTTP/2
# internal error, HTTP/1.1 hangs until timeout, reproduced with curl); web search confirms
# the Australia Awards program page is live at this domain. Excluding rather than removing.
#
# www.jobbank.gc.ca/youth: reported in #561 as "Connection reset by peer"; absent from the
# #556 run, and curl returns a clean 200 with real content. Intermittent resets from the
# CI runner range, same signature as the other Government of Canada exclusion above.
#
# cuet.nta.nic.in: timed out in the #556 run, passed in #561; curl returns 200. A slow
# Indian government host, not a dead one, so excluded to stop it flapping the check.
exclude = [
  "https://www.autodesk.com/education/edu-software/overview",
  "https://freedomhomeschooling.com/",
  "https://www.adobe.com/creativecloud/buy/students.html",
  "https://www.dfat.gov.au/people-to-people/new-colombo-plan",
  "https://www.turing-scheme.org.uk",
  "https://chadd.org/",
  "https://www.canada.ca/en/financial-consumer-agency.html",
  "https://www.dewr.gov.au/australian-apprenticeships",
  "https://ncfe.org.in/",
  "https://swe.org/apply-for-a-swe-scholarship/",
  "https://telemanas.mohfw.gov.in/",
  "https://www.nsfas.org.za/content/repayments.html",
  "https://www.dfat.gov.au/people-to-people/australia-awards/pages/australia-awards.aspx",
  "https://www.jobbank.gc.ca/youth",
  "https://cuet.nta.nic.in/",
]
