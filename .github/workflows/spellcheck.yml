name: Spellcheck

on:
  pull_request:
    paths:
      - README.md
      - CONTRIBUTING.md
      - CODE_OF_CONDUCT.md
      - CHANGELOG.md
      - SECURITY.md
      - CONTRIBUTORS.md
      - scripts/README.md
      - .github/*.md
      - .codespellignore
  push:
    branches:
      - main
    paths:
      - README.md
      - CONTRIBUTING.md
      - CODE_OF_CONDUCT.md
      - CHANGELOG.md
      - SECURITY.md
      - CONTRIBUTORS.md
      - scripts/README.md
      - .github/*.md
      - .codespellignore

jobs:
  codespell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: codespell-project/actions-codespell@v2
        with:
          path: README.md CONTRIBUTING.md CODE_OF_CONDUCT.md CHANGELOG.md SECURITY.md CONTRIBUTORS.md scripts/README.md .github/*.md
          ignore_words_file: .codespellignore
